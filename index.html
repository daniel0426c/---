<!DOCTYPE html>
<html lang="ko">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토요교제 수송표 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .student-chip {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .student-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .student-chip:active {
            transform: translateY(0);
        }
        .modal-enter { animation: modalFadeIn 0.2s ease-out forwards; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialStudents = [
            { id: '1', name: '서태진', type: 'b' }, { id: '2', name: '이우빈', type: 'b' },
            { id: '3', name: '이정빈', type: 'b' }, { id: '4', name: '최은결', type: 'b' },
            { id: '5', name: '오한결', type: 'b' }, { id: '6', name: '이창빈', type: 'b' },
            { id: '7', name: '지재윤', type: 'b' }, { id: '8', name: '황은택', type: 'b' },
            { id: '9', name: '서우진', type: 'b' }, { id: '10', name: '최민성', type: 'b' },
            { id: '11', name: '송유근', type: 'b' }, { id: '12', name: '엄성현', type: 'b' },
            { id: '13', name: '송유현', type: 'b' }, { id: '14', name: '권나희', type: 's' },
            { id: '15', name: '김하윤', type: 's' }, { id: '16', name: '이소미', type: 's' },
            { id: '17', name: '양채희', type: 's' }, { id: '18', name: '이지현', type: 's' },
            { id: '19', name: '임율', type: 's' }, { id: '20', name: '지수연', type: 's' },
            { id: '21', name: '박소율', type: 's' }, { id: '22', name: '양찬희', type: 'b' },
            { id: '23', name: '이지호', type: 'b' }, { id: '24', name: '이정현', type: 'b' },
            { id: '25', name: '박태우', type: 'b' }, { id: '26', name: '이우진', type: 'b' },
            { id: '27', name: '홍종인', type: 'b' }, { id: '28', name: '오석진', type: 'b' },
            { id: '29', name: '서준서', type: 'b' }, { id: '30', name: '지재람', type: 'b' },
            { id: '31', name: '박소윤', type: 's' }, { id: '32', name: '장은서', type: 's' },
            { id: '33', name: '서예은', type: 's' }, { id: '34', name: '황혜민', type: 's' },
            { id: '35', name: '박주희', type: 's' }, { id: '36', name: '최가은', type: 's' },
            { id: '37', name: '서현진', type: 'b' }, { id: '38', name: '이윤서', type: 's' },
            { id: '39', name: '임지은', type: 's' }, { id: '40', name: '고유주', type: 's' },
            { id: '41', name: '김윤아', type: 's' }, { id: '42', name: '정예진', type: 's' }
        ];

        const initialTeachers = [
            { id: 't1', name: '김도현' }, { id: 't2', name: '장민수' },
            { id: 't3', name: '박원산' }, { id: 't4', name: '손진남' },
            { id: 't5', name: '김시현' }
        ];

        const initialRoutes = [
            { id: 'r1', name: '양주방향', icon: '🚗' },
            { id: 'r2', name: '동두천 방향', icon: '🚙' }
        ];

        const App = () => {
            const [students] = useState(initialStudents);
            const [teachers] = useState(initialTeachers);
            const [routes] = useState(initialRoutes);
            
            // 8/29 예시와 동일하게 기본 배정값 설정
            const initialSchedule = {
                'r1': {
                    't1': ['1', '37', '24'], // 김도현: 서태진, 서현진, 이정현
                    't2': ['25', '14'],      // 장민수: 박태우, 권나희
                },
                'r2': {
                    't3': ['40', '42', '4', '21', '18', '20', '16'], // 박원산
                    't4': ['39', '5', '28']                          // 손진남
                }
            };

            const [schedule, setSchedule] = useState(initialSchedule);
            const [scheduleDate, setScheduleDate] = useState("8/29(토)");
            const [scheduleTitle, setScheduleTitle] = useState("토요교제 수송표");
            
            // 배정 모달 상태
            const [assigningStudentId, setAssigningStudentId] = useState(null); 
            const [isCopied, setIsCopied] = useState(false);

            const getAssignedStudentIds = () => {
                const assigned = new Set();
                Object.values(schedule).forEach(route => {
                    Object.values(route).forEach(teacherStudents => {
                        teacherStudents.forEach(id => assigned.add(id));
                    });
                });
                return Array.from(assigned);
            };

            const getUnassignedStudents = () => {
                const assignedIds = getAssignedStudentIds();
                return students.filter(s => !assignedIds.includes(s.id));
            };

            const getStudentById = (id) => students.find(s => s.id === id);
            const getTeacherById = (id) => teachers.find(t => t.id === id);

            // 학생 클릭 시 모달 열기
            const handleStudentClick = (studentId) => {
                setAssigningStudentId(studentId);
            };

            // 모달에서 특정 교사 차량으로 배정 실행
            const executeAssignment = (targetRouteId, targetTeacherId) => {
                if (!assigningStudentId) return;

                setSchedule(prev => {
                    let next = JSON.parse(JSON.stringify(prev));
                    
                    // 1. 기존 배정에서 학생 지우기
                    Object.keys(next).forEach(rId => {
                        Object.keys(next[rId]).forEach(tId => {
                            next[rId][tId] = next[rId][tId].filter(id => id !== assigningStudentId);
                        });
                    });

                    // 2. 새로운 곳에 할당 (null, null 이면 미배정 처리됨)
                    if (targetRouteId && targetTeacherId) {
                        if (!next[targetRouteId]) next[targetRouteId] = {};
                        if (!next[targetRouteId][targetTeacherId]) next[targetRouteId][targetTeacherId] = [];
                        if (!next[targetRouteId][targetTeacherId].includes(assigningStudentId)) {
                            next[targetRouteId][targetTeacherId].push(assigningStudentId);
                        }
                    }
                    return next;
                });
                setAssigningStudentId(null); // 모달 닫기
            };

            const handleAddTeacherToRoute = (routeId, teacherId) => {
                if (!teacherId) return;
                setSchedule(prev => {
                    const next = { ...prev };
                    if (!next[routeId]) next[routeId] = {};
                    if (!next[routeId][teacherId]) next[routeId][teacherId] = [];
                    return next;
                });
            };

            const handleRemoveTeacherFromRoute = (routeId, teacherId) => {
                if (window.confirm("이 차량의 배정 정보가 삭제됩니다. 계속하시겠습니까?")) {
                    setSchedule(prev => {
                        const next = JSON.parse(JSON.stringify(prev));
                        if (next[routeId] && next[routeId][teacherId]) {
                            delete next[routeId][teacherId];
                        }
                        return next;
                    });
                }
            };

            const generateScheduleText = () => {
                try {
                    let text = `✅${scheduleDate} ${scheduleTitle}✅\n\n`;

                    routes.forEach((route, routeIndex) => {
                        const routeSchedule = schedule[route.id] || {};
                        const activeTeachers = Object.keys(routeSchedule);
                        
                        let routeText = "";
                        let hasStudents = false;

                        activeTeachers.forEach((teacherId, tIndex) => {
                            const teacher = getTeacherById(teacherId);
                            const assignedStudents = routeSchedule[teacherId] || [];
                            
                            if (teacher && assignedStudents.length > 0) {
                                hasStudents = true;
                                
                                // 기본 교사 이름 텍스트 설정 (ex: "김도현t - ")
                                const prefix = `${teacher.name}t - `;
                                routeText += prefix;
                                
                                const studentNames = assignedStudents
                                    .map(sId => {
                                        const student = getStudentById(sId);
                                        return student ? `${student.name}${student.type}` : '';
                                    })
                                    .filter(Boolean);
                                
                                let currentLine = "";
                                let resultLines = [];
                                
                                // 첫 줄 글자수 측정용 (교사 이름 + 띄어쓰기 길이 감안)
                                let prefixLength = prefix.length;
                                
                                studentNames.forEach((name, index) => {
                                    const isFirst = index === 0;
                                    const addition = isFirst ? name : `, ${name}`;
                                    
                                    // 대략적인 한글 문자열 길이 체크 (20자 내외에서 자르기)
                                    if (currentLine.length + addition.length > 20 && !isFirst) {
                                        resultLines.push(currentLine + ",");
                                        // 다음 줄은 교사 이름만큼 띄우기 (카톡 스타일 공백)
                                        currentLine = "               " + name; 
                                    } else {
                                        currentLine += addition;
                                    }
                                });
                                if (currentLine) {
                                    resultLines.push(currentLine);
                                }
                                
                                routeText += resultLines.join("\n") + "\n\n";
                            }
                        });

                        // 차량에 배정된 학생이 있을 때만 경로 헤더를 출력
                        if (hasStudents) {
                            text += `${route.icon}${route.name}${route.icon}\n\n`;
                            text += routeText;
                        }
                    });
                    
                    return text.trim();
                } catch (error) {
                    console.error("Text Generation Error:", error);
                    return "미리보기를 생성하는 중 오류가 발생했습니다.";
                }
            };

            const copyToClipboard = () => {
                const text = generateScheduleText();
                if(!text) return;
                
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setIsCopied(true);
                    setTimeout(() => setIsCopied(false), 2000);
                } catch (err) {
                    console.error('Failed to copy text', err);
                }
                document.body.removeChild(textArea);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-6 min-h-screen flex flex-col">
                    <header className="mb-6 flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-gray-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-black text-gray-800 flex items-center gap-2">
                                <i className="fas fa-car-side text-blue-500"></i> 수송표 자동 생성기
                            </h1>
                            <p className="text-blue-600 font-bold text-sm mt-1">
                                <i className="fas fa-hand-pointer mr-1"></i> 
                                학생을 클릭하면 팝업이 떠서 원하는 차량으로 바로 배정할 수 있습니다!
                            </p>
                        </div>
                    </header>

                    <div className="space-y-6 flex-1 flex flex-col">
                        {/* Title Settings */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-center">
                            <div className="flex items-center gap-2">
                                <label className="text-sm font-bold text-gray-700">날짜:</label>
                                <input 
                                    type="text" 
                                    value={scheduleDate} 
                                    onChange={(e) => setScheduleDate(e.target.value)}
                                    className="border border-gray-300 rounded px-3 py-1.5 text-sm w-32 focus:ring-2 focus:ring-blue-500 outline-none font-bold"
                                />
                            </div>
                            <div className="flex items-center gap-2">
                                <label className="text-sm font-bold text-gray-700">제목:</label>
                                <input 
                                    type="text" 
                                    value={scheduleTitle} 
                                    onChange={(e) => setScheduleTitle(e.target.value)}
                                    className="border border-gray-300 rounded px-3 py-1.5 text-sm w-48 focus:ring-2 focus:ring-blue-500 outline-none font-bold"
                                />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 items-start">
                            {/* Left: Schedule Areas */}
                            <div className="lg:col-span-2 space-y-6">
                                {routes.map(route => (
                                    <div key={route.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                        <div className="bg-gray-50 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                                            <h2 className="font-bold text-gray-800 flex items-center gap-2 text-lg">
                                                <span>{route.icon}</span> {route.name}
                                            </h2>
                                            
                                            <select 
                                                className="text-sm border border-gray-300 rounded-md px-2 py-1.5 outline-none focus:border-blue-500 bg-white font-medium shadow-sm cursor-pointer"
                                                onChange={(e) => {
                                                    handleAddTeacherToRoute(route.id, e.target.value);
                                                    e.target.value = "";
                                                }}
                                                defaultValue=""
                                            >
                                                <option value="" disabled>+ 교사 추가</option>
                                                {teachers.map(t => (
                                                    <option 
                                                        key={t.id} 
                                                        value={t.id}
                                                        disabled={schedule[route.id] && schedule[route.id][t.id] !== undefined}
                                                    >
                                                        {t.name}t
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="p-4 bg-gray-50/30">
                                            {(!schedule[route.id] || Object.keys(schedule[route.id]).length === 0) ? (
                                                <div className="text-center py-6 text-gray-400 text-sm font-medium">
                                                    우측 상단에서 차량(교사)을 추가해주세요.
                                                </div>
                                            ) : (
                                                <div className="space-y-4">
                                                    {Object.keys(schedule[route.id]).map(teacherId => {
                                                        const teacher = getTeacherById(teacherId);
                                                        if (!teacher) return null;
                                                        const assignedStudents = schedule[route.id][teacherId] || [];

                                                        return (
                                                            <div key={teacherId} className="relative group border border-gray-200 rounded-lg p-3 bg-white hover:border-blue-300 transition-colors shadow-sm">
                                                                <div className="flex justify-between items-center mb-3">
                                                                    <div className="flex items-center gap-2">
                                                                        <div className="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                                                            {teacher.name.charAt(0)}
                                                                        </div>
                                                                        <span className="font-bold text-gray-800 text-base">{teacher.name}t</span>
                                                                        <span className="text-xs text-blue-700 bg-blue-50 px-2 py-1 rounded-full border border-blue-200 font-bold shadow-sm">
                                                                            {assignedStudents.length}명
                                                                        </span>
                                                                    </div>
                                                                    <button 
                                                                        onClick={() => handleRemoveTeacherFromRoute(route.id, teacherId)}
                                                                        className="text-gray-300 hover:text-red-500 transition-colors focus:outline-none w-8 h-8 rounded-full hover:bg-red-50 flex justify-center items-center"
                                                                        title="차량 삭제"
                                                                    >
                                                                        <i className="fas fa-trash-alt text-sm"></i>
                                                                    </button>
                                                                </div>
                                                                
                                                                {/* Teacher's Students Box */}
                                                                <div className="flex flex-wrap gap-2 min-h-[44px] items-center bg-gray-50/80 rounded-md p-2 border border-gray-100">
                                                                    {assignedStudents.length === 0 && (
                                                                        <span className="text-gray-400 text-sm italic pl-2">우측 미배정 학생을 클릭하여 배정하세요.</span>
                                                                    )}
                                                                    {assignedStudents.map(sId => {
                                                                        const student = getStudentById(sId);
                                                                        if (!student) return null;
                                                                        const isBrother = student.type === 'b';
                                                                        return (
                                                                            <button 
                                                                                key={sId} 
                                                                                onClick={() => handleStudentClick(sId)} 
                                                                                className={`student-chip inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm font-bold border ${isBrother ? 'bg-blue-50 border-blue-200 text-blue-800' : 'bg-pink-50 border-pink-200 text-pink-800'}`}
                                                                            >
                                                                                {student.name}{student.type}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Right: Unassigned & Preview */}
                            <div className="lg:col-span-1 flex flex-col gap-6 lg:sticky lg:top-6">
                                {/* Unassigned List */}
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 max-h-[35vh] overflow-y-auto">
                                    <div className="flex justify-between items-center mb-3 sticky top-0 bg-white/95 backdrop-blur-sm z-10 pb-2 border-b">
                                        <h3 className="font-bold text-gray-700 text-sm flex items-center gap-1">
                                            <i className="fas fa-users text-gray-400"></i> 미배정 학생
                                        </h3>
                                        <span className="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full font-bold shadow-sm">
                                            {getUnassignedStudents().length}명
                                        </span>
                                    </div>
                                    <div className="flex flex-wrap gap-2 pt-1">
                                        {getUnassignedStudents().map(s => (
                                            <button 
                                                key={s.id} 
                                                onClick={() => handleStudentClick(s.id)}
                                                className={`student-chip inline-flex items-center px-3 py-1.5 rounded-full text-sm font-bold border bg-white shadow-sm ${
                                                    s.type === 'b' ? 'border-gray-200 text-blue-700 hover:border-blue-400 hover:bg-blue-50' : 'border-gray-200 text-pink-700 hover:border-pink-400 hover:bg-pink-50'
                                                }`}
                                            >
                                                {s.name}{s.type}
                                            </button>
                                        ))}
                                        {getUnassignedStudents().length === 0 && (
                                            <div className="w-full text-center py-6 text-gray-400 text-sm flex flex-col items-center">
                                                <i className="fas fa-check-circle text-green-400 text-3xl mb-2"></i>
                                                모든 학생 배정 완료!
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Preview */}
                                <div className="bg-gray-800 rounded-xl shadow-lg text-white flex flex-col flex-1 h-[45vh]">
                                    <div className="bg-gray-900 px-4 py-3 border-b border-gray-700 flex justify-between items-center shrink-0 rounded-t-xl">
                                        <h3 className="font-bold flex items-center gap-2 text-sm">
                                            <i className="fab fa-whatsapp text-green-400"></i> 카톡 복사용 미리보기
                                        </h3>
                                        <button 
                                            onClick={copyToClipboard}
                                            className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-1 shadow-sm ${isCopied ? 'bg-green-500 text-white scale-95' : 'bg-gray-700 text-gray-200 hover:bg-gray-600'}`}
                                        >
                                            {isCopied ? <><i className="fas fa-check"></i> 복사완료!</> : <><i className="far fa-copy"></i> 전체 복사</>}
                                        </button>
                                    </div>
                                    <div className="p-4 overflow-y-auto h-full">
                                        <pre className="text-sm font-mono whitespace-pre-wrap leading-[1.6] text-gray-100 font-medium">
                                            {generateScheduleText() || "배정된 학생이 없습니다."}
                                        </pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Assignment Modal popup */}
                    {assigningStudentId && (
                        <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setAssigningStudentId(null)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden modal-enter border border-gray-100" onClick={e => e.stopPropagation()}>
                                <div className="bg-gray-50 px-5 py-4 border-b border-gray-200 flex justify-between items-center">
                                    <h3 className="font-black text-gray-800 text-lg flex items-center gap-2">
                                        <span className="text-blue-600">{getStudentById(assigningStudentId)?.name}</span> 
                                        학생 이동
                                    </h3>
                                    <button onClick={() => setAssigningStudentId(null)} className="text-gray-400 hover:text-gray-700 w-8 h-8 rounded-full hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-5 max-h-[60vh] overflow-y-auto">
                                    <p className="text-sm text-gray-500 mb-4 font-bold text-center">어느 교사 차량으로 배정하시겠습니까?</p>
                                    
                                    <div className="space-y-4">
                                        {routes.map(route => {
                                            const teachersInRoute = Object.keys(schedule[route.id] || {});
                                            if (teachersInRoute.length === 0) return null;
                                            return (
                                                <div key={route.id} className="bg-gray-50 rounded-xl p-3 border border-gray-200">
                                                    <h4 className="text-sm font-black text-gray-700 mb-2 flex items-center gap-1 justify-center">
                                                        {route.icon} {route.name}
                                                    </h4>
                                                    <div className="grid grid-cols-1 gap-2">
                                                        {teachersInRoute.map(tId => {
                                                            const teacher = getTeacherById(tId);
                                                            const count = (schedule[route.id][tId] || []).length;
                                                            return (
                                                                <button 
                                                                    key={tId}
                                                                    onClick={() => executeAssignment(route.id, tId)}
                                                                    className="flex justify-between items-center px-4 py-3 bg-white border-2 border-gray-200 rounded-lg text-sm text-left hover:bg-blue-50 hover:border-blue-400 active:bg-blue-100 transition-all shadow-sm group"
                                                                >
                                                                    <span className="font-bold text-gray-800 group-hover:text-blue-700 text-base">{teacher.name}t</span>
                                                                    <span className="text-xs bg-gray-100 px-2 py-1 rounded-full text-gray-600 font-bold group-hover:bg-blue-100 group-hover:text-blue-700">현재 {count}명 탑승중</span>
                                                                </button>
                                                            )
                                                        })}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>

                                    {routes.every(route => Object.keys(schedule[route.id] || {}).length === 0) && (
                                        <div className="text-center py-6 text-sm text-red-500 font-bold bg-red-50 rounded-lg border border-red-100">
                                            추가된 교사 차량이 없습니다.<br/>메인화면에서 먼저 교사를 추가해주세요.
                                        </div>
                                    )}

                                    <div className="mt-5 pt-4 border-t border-gray-200">
                                        <button 
                                            onClick={() => executeAssignment(null, null)}
                                            className="w-full px-4 py-3 bg-white hover:bg-red-50 border-2 border-gray-200 hover:border-red-300 text-gray-700 hover:text-red-600 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2 shadow-sm"
                                        >
                                            <i className="fas fa-arrow-down"></i> 차량에서 빼기 (미배정으로 이동)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
